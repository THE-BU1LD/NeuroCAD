[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neurocad-research"
version = "0.5.0a6"
description = "Strict prompt-to-OpenSCAD generation for dimensioned plates, enclosures, and primitives"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.23,<5", "numpy>=1.26,<3", "trimesh>=4,<6"]
authors = [{name = "THE BU1LD"}]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
keywords = ["openscad", "cad", "3d-printing", "parametric-design"]

[project.optional-dependencies]
dev = ["build==1.6.0", "mypy==1.18.2", "pytest==9.1.1", "ruff==0.16.5"]
security = ["bandit==1.9.4", "pip-audit==2.10.1"]

[tool.ruff]
target-version = "py310"
line-length = 140

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
pythonpath = ["."]

[tool.mypy]
python_version = "3.10"
explicit_package_bases = true
ignore_missing_imports = true
no_site_packages = true
warn_unused_configs = true

[project.urls]
Repository = "https://github.com/THE-BU1LD/NeuroCAD"

[project.scripts]
neurocad = "neurocad_cli:main"
text-to-cad = "text_to_openscad:main"

[tool.setuptools]
py-modules = ["neurocad_cli", "text_to_cad", "text_to_openscad"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]

[tool.setuptools.package-data]
core = ["schemas/*.json"]
