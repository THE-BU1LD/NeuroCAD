name: NeuroCAD CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10.21", "3.11.16", "3.12.14"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install build and test tooling
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xauth xvfb
          python -m pip install --upgrade "pip==26.2.1"

      - name: Install NeuroCAD editable
        run: python -m pip install -e '.[dev,security]'

      - name: Compile shipped Python sources
        shell: bash
        run: |
          python -m compileall -q neurocad_cli.py text_to_cad.py text_to_openscad.py core research/vericodegen scripts/normalize_sdist.py scripts/verify_distribution.py surfaces.py vector_fields_engine.py pipeline_stage.py exceptions.py thinking_engine.py

      - name: Run maintained release tests
        shell: bash
        run: |
          if [ -d tests ]; then
            python -m pytest -q tests
          else
            echo "No tests/ directory found; continuing with package smoke gates."
          fi

      - name: Lint maintained product
        run: python -m ruff check core research/vericodegen scripts/normalize_sdist.py scripts/verify_distribution.py neurocad_cli.py text_to_cad.py text_to_openscad.py surfaces.py vector_fields_engine.py pipeline_stage.py exceptions.py thinking_engine.py tests

      - name: Type-check maintained product and research tooling
        if: matrix.python-version == '3.12'
        run: python -m mypy core research/vericodegen scripts/normalize_sdist.py scripts/verify_distribution.py neurocad_cli.py text_to_cad.py text_to_openscad.py surfaces.py vector_fields_engine.py pipeline_stage.py exceptions.py thinking_engine.py

      - name: Audit dependencies and supported source
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          python -m pip check
          python -m pip_audit --requirement requirements-research.lock --no-deps --disable-pip --progress-spinner off
          python -m bandit -q -r core research/vericodegen scripts/normalize_sdist.py scripts/verify_distribution.py neurocad_cli.py text_to_cad.py text_to_openscad.py surfaces.py vector_fields_engine.py pipeline_stage.py exceptions.py thinking_engine.py -x '*/__pycache__/*'

      - name: CLI smoke test
        shell: bash
        run: |
          neurocad --version
          neurocad doctor
          neurocad validate "a 120 x 80 x 4 mm plate with four 4 mm holes"
          if neurocad validate "an unsupported warp drive"; then
            echo "Unsupported prompt unexpectedly validated." >&2
            exit 1
          fi
          neurocad create "a 120 x 80 x 4 mm plate with four 4 mm holes" -o /tmp/neurocad-smoke.scad --manifest /tmp/neurocad-smoke.json
          neurocad ir "a 120 x 80 x 4 mm plate with four 4 mm holes" -o /tmp/neurocad-smoke.ncad.json
          neurocad compile /tmp/neurocad-smoke.ncad.json --format scad -o /tmp/neurocad-compiled.scad
          neurocad evaluate --ir /tmp/neurocad-smoke.ncad.json > /tmp/neurocad-evaluation.json
          neurocad benchmark --dataset /tmp/neurocad-benchmark.jsonl --output /tmp/neurocad-benchmark-results.json
          xvfb-run -a neurocad research \
            --output /tmp/neurocad-research-smoke \
            --run-id NC-CI-SMOKE \
            --compiler-tasks 35 \
            --ir-programs 36 \
            --invalid-cases 16 \
            --edit-cases 12 \
            --constraint-ablation-cases 12 \
            --kernel-samples 2 \
            --fn 12 \
            --require-kernel
          neurocad export "a 40 x 30 x 3 mm plate with four 3 mm holes" --format stl -o /tmp/neurocad-smoke.stl
          neurocad enclosure interpret "60 x 40 x 20 mm electronics enclosure; walls 2 mm; profile fdm standard; friction lid 2 mm thick clearance 0.3 mm lip 2 mm; title CI enclosure" --project-id ci-enclosure --project-output /tmp/neurocad-enclosure.ncad.json
          neurocad integrations export /tmp/neurocad-enclosure.ncad.json --output-dir /tmp/neurocad-exchange --stl --fn 12
          neurocad integrations verify /tmp/neurocad-exchange > /tmp/neurocad-exchange-verification.json
          test -s /tmp/neurocad-smoke.scad
          test -s /tmp/neurocad-smoke.json
          test -s /tmp/neurocad-smoke.stl
          test -s /tmp/neurocad-compiled.scad
          test -s /tmp/neurocad-evaluation.json
          test -s /tmp/neurocad-benchmark-results.json
          test -s /tmp/neurocad-research-smoke/manifest.json
          test -s /tmp/neurocad-enclosure.ncad.json
          test -s /tmp/neurocad-exchange/manifest.json
          test -s /tmp/neurocad-exchange-verification.json

      - name: Build wheel and source distribution
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          dist_dir="$RUNNER_TEMP/neurocad-dist"
          python -m build --no-isolation --outdir "$dist_dir"
          sdist_files=("$dist_dir"/neurocad_research-*.tar.gz)
          test "${#sdist_files[@]}" -eq 1
          python scripts/normalize_sdist.py "${sdist_files[0]}" "$SOURCE_DATE_EPOCH"
          python scripts/verify_distribution.py "$dist_dir"/neurocad_research-*.whl "${sdist_files[0]}"
          if [ "${{ matrix.python-version }}" = "3.12.14" ]; then
            repeat_dir="$RUNNER_TEMP/neurocad-dist-repeat"
            python -m build --no-isolation --outdir "$repeat_dir"
            repeat_sdists=("$repeat_dir"/neurocad_research-*.tar.gz)
            test "${#repeat_sdists[@]}" -eq 1
            python scripts/normalize_sdist.py "${repeat_sdists[0]}" "$SOURCE_DATE_EPOCH"
            cmp "$dist_dir"/neurocad_research-*.whl "$repeat_dir"/neurocad_research-*.whl
            cmp "${sdist_files[0]}" "${repeat_sdists[0]}"
          fi

      - name: Fresh wheel install smoke test
        shell: bash
        run: |
          python -m venv /tmp/neurocad-clean
          /tmp/neurocad-clean/bin/python -m pip install --upgrade "pip==26.2.1"
          wheel_files=("$RUNNER_TEMP"/neurocad-dist/neurocad_research-*.whl)
          test "${#wheel_files[@]}" -eq 1
          /tmp/neurocad-clean/bin/python -m pip install "${wheel_files[0]}"
          /tmp/neurocad-clean/bin/neurocad --version
          /tmp/neurocad-clean/bin/neurocad doctor
          /tmp/neurocad-clean/bin/neurocad create "a 120 x 80 x 4 mm plate with four 4 mm holes" -o /tmp/fresh-install.scad
          /tmp/neurocad-clean/bin/neurocad ir "a 40 x 30 x 3 mm plate" -o /tmp/fresh-install.ncad.json
          /tmp/neurocad-clean/bin/neurocad compile /tmp/fresh-install.ncad.json --format scad -o /tmp/fresh-compiled.scad
          /tmp/neurocad-clean/bin/neurocad integrations kicad-extract --help
          test -s /tmp/fresh-install.scad
          test -s /tmp/fresh-compiled.scad

      - name: Fresh source-distribution install smoke test
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          python -m venv /tmp/neurocad-clean-sdist
          /tmp/neurocad-clean-sdist/bin/python -m pip install --upgrade "pip==26.2.1"
          sdist_files=("$RUNNER_TEMP"/neurocad-dist/neurocad_research-*.tar.gz)
          test "${#sdist_files[@]}" -eq 1
          /tmp/neurocad-clean-sdist/bin/python -m pip install "${sdist_files[0]}"
          /tmp/neurocad-clean-sdist/bin/neurocad --version
          /tmp/neurocad-clean-sdist/bin/neurocad validate "a 40 x 30 x 3 mm plate"

      - name: Git-history high-confidence secret gate
        shell: bash
        run: |
          set -eu
          patterns='(ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{50,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sk-[A-Za-z0-9]{32,})'
          if git log -p --all --no-ext-diff --no-color | grep -Eq "$patterns"; then
            echo "Potential high-confidence secret pattern found in Git history." >&2
            echo "Rotate/revoke the credential and rewrite history before public release." >&2
            exit 1
          fi
          echo "No high-confidence secret patterns detected in Git history."

      - name: Upload distributions
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: neurocad-dist
          path: ${{ runner.temp }}/neurocad-dist/*

  portable-python:
    name: Portable Python / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.14"
          cache: pip

      - name: Install portable product
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install -e '.[dev]'

      - name: Run kernel-independent product tests
        run: python -m pytest -q tests

      - name: Compile and lint supported sources
        run: |
          python -m compileall -q neurocad_cli.py text_to_cad.py text_to_openscad.py core research/vericodegen surfaces.py vector_fields_engine.py pipeline_stage.py exceptions.py thinking_engine.py
          python -m ruff check core research/vericodegen neurocad_cli.py text_to_cad.py text_to_openscad.py surfaces.py vector_fields_engine.py pipeline_stage.py exceptions.py thinking_engine.py tests

      - name: Type-check portable sources
        run: python -m mypy core neurocad_cli.py text_to_cad.py text_to_openscad.py surfaces.py vector_fields_engine.py pipeline_stage.py exceptions.py thinking_engine.py

      - name: Portable CLI smoke
        run: |
          neurocad --version
          neurocad validate "a 40 x 30 x 3 mm plate"
          neurocad ir "a sphere with radius 0.5 inch" -o portable.ncad.json
          neurocad compile portable.ncad.json --format scad -o portable.scad
