name: External evidence integrity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/physics_v3/external_validation_v1/**'
      - '.github/workflows/external-evidence-integrity.yml'
  push:
    paths:
      - 'research/physics_v3/external_validation_v1/**'
      - '.github/workflows/external-evidence-integrity.yml'

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Synthetic integrity regressions only
        run: python -m unittest discover -s research/physics_v3/external_validation_v1 -p 'test_*.py' -v
