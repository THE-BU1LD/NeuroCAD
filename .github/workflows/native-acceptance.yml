name: Native CAD acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native goldens / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      NEUROCAD_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - name: Preserve committed bytes on every platform
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          # Same portable interpreter as the maintained OS matrix; 3.12.14
          # security-only artifacts are unavailable on macOS and Windows.
          python-version: "3.13.15"
          cache: pip
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa libxft2
      - name: Install exact pinned optional backends
        run: |
          python -m pip install -e '.[dev,exact-build123d,mesh-gmsh]'
          python -m pip check
          python -m pip freeze --all > native-environment.txt
      - name: Verify native and rejection cases
        run: python -m pytest -q tests/test_native_acceptance.py tests/test_mesh_roles.py tests/test_exact_build123d.py tests/test_cad_mesh_native.py tests/test_gmsh_backend.py tests/test_gmsh_process.py tests/test_exact_backend.py tests/test_feature_ir.py tests/test_final_geometry_requirements.py tests/test_final_geometry_native.py tests/test_final_bore_contract.py tests/test_final_bore_native.py --basetemp="${{ runner.temp }}/native-tests" --junitxml="${{ runner.temp }}/native-tests.xml"
      - name: Execute five goldens and six source-bound meshing runs
        run: python scripts/verify_native_acceptance.py "${{ runner.temp }}/native-acceptance"
      - name: Verify installed wheel outside the source checkout
        shell: bash
        run: |
          python - <<'PYCODE'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          source = Path.cwd().resolve()
          output = Path(os.environ["RUNNER_TEMP"]) / "installed-candidate"
          output.mkdir(exist_ok=False)
          wheels = output / "dist"
          subprocess.run([sys.executable, "-m", "build", "--wheel", "--outdir", str(wheels)], check=True)
          wheel, = wheels.glob("*.whl")
          modules = {"core.final_geometry": "core/final_geometry.py",
                     "core.conversational_parser": "core/conversational_parser.py",
                     "core.evaluation_ledger": "core/evaluation_ledger.py",
                     "neurocad_cli": "neurocad_cli.py"}
          expected = {module: hashlib.sha256((source / path).read_bytes()).hexdigest()
                      for module, path in modules.items()}
          subprocess.run([sys.executable, "-m", "pip", "install", "--force-reinstall", "--no-deps", str(wheel)], check=True)
          detached = output / "tests"
          detached.mkdir()
          cases = ["test_final_geometry_requirements.py", "test_final_geometry_native.py",
                   "test_final_bore_contract.py", "test_final_bore_native.py",
                   "test_bore_numerical_admission.py", "test_completion_language.py",
                   "test_evaluation_ledger.py", "test_ledger_integrity.py"]
          for name in cases:
              shutil.copyfile(source / "tests" / name, detached / name)
          env = dict(os.environ)
          env.pop("PYTHONPATH", None)
          env["PYTEST_DISABLE_PLUGIN_AUTOLOAD"] = "1"
          code = """import hashlib, importlib, json
          from pathlib import Path
          names = ['core.final_geometry', 'core.conversational_parser', 'core.evaluation_ledger', 'neurocad_cli']
          import build123d
          result = {}
          for name in names:
              path = Path(importlib.import_module(name).__file__).resolve()
              result[name] = {'path': str(path), 'sha256': hashlib.sha256(path.read_bytes()).hexdigest()}
          print(json.dumps(result))
          """
          origins = json.loads(subprocess.check_output([sys.executable, "-c", code], cwd=detached, env=env, text=True))
          for name, info in origins.items():
              assert not Path(info["path"]).is_relative_to(source), info
              assert info["sha256"] == expected[name], info
          (output / "origin.json").write_text(json.dumps({"source_commit": os.environ["NEUROCAD_SOURCE_COMMIT"],
              "wheel_sha256": hashlib.sha256(wheel.read_bytes()).hexdigest(), "modules": origins}, indent=2), encoding="utf-8")
          result = subprocess.run([sys.executable, "-m", "pytest", "-q", *cases,
              "-o", "pythonpath=", "--confcutdir", str(detached),
              "--junitxml", str(output / "tests.xml")], cwd=detached, env=env, check=False)
          if result.returncode:
              raise SystemExit(result.returncode)
          suites = ET.parse(output / "tests.xml").getroot().iter("testsuite")
          assert all(int(suite.get("skipped", "0")) == 0 for suite in suites), "Installed acceptance cannot silently skip"
          PYCODE
      - name: Retain cases and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-acceptance-${{ matrix.os }}
          path: |
            native-environment.txt
            ${{ runner.temp }}/native-tests.xml
            ${{ runner.temp }}/native-tests
            ${{ runner.temp }}/native-acceptance
            ${{ runner.temp }}/installed-candidate
          retention-days: 30
