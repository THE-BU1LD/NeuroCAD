name: Native CAD acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native goldens / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      NEUROCAD_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
          cache: pip
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa libxft2
      - name: Install exact pinned optional backends
        run: |
          python -m pip install -e '.[dev,exact-build123d,mesh-gmsh]'
          python -m pip check
          python -m pip freeze --all > native-environment.txt
      - name: Verify native and rejection cases
        run: python -m pytest -q tests/test_native_acceptance.py tests/test_mesh_roles.py tests/test_exact_build123d.py tests/test_cad_mesh_native.py tests/test_gmsh_backend.py tests/test_gmsh_process.py tests/test_exact_backend.py tests/test_feature_ir.py --basetemp="${{ runner.temp }}/native-tests" --junitxml="${{ runner.temp }}/native-tests.xml"
      - name: Execute five goldens and six source-bound meshing runs
        run: python scripts/verify_native_acceptance.py "${{ runner.temp }}/native-acceptance"
      - name: Retain cases and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-acceptance-${{ matrix.os }}
          path: |
            native-environment.txt
            ${{ runner.temp }}/native-tests.xml
            ${{ runner.temp }}/native-tests
            ${{ runner.temp }}/native-acceptance
          retention-days: 30
