name: Gmsh integrity regression

on:
  pull_request:
    paths:
      - core/gmsh_backend.py
      - core/gmsh_integrity.py
      - tests/test_gmsh_backend.py
      - tests/test_gmsh_contract.py
      - tests/test_gmsh_integrity.py
      - pyproject.toml
      - .github/workflows/gmsh-integrity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
          cache: pip
      - name: Install existing pinned optional backend and development tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa
          python -m pip install -e '.[dev,mesh-gmsh]'
          python -m pip check
      - name: Run native fixture and all mesh integrity contracts
        run: |
          python -m pytest -q tests/test_gmsh_backend.py tests/test_gmsh_contract.py tests/test_gmsh_integrity.py
          python -m compileall -q core/gmsh_backend.py core/gmsh_integrity.py
          python -m ruff check core/gmsh_backend.py core/gmsh_integrity.py tests/test_gmsh_contract.py tests/test_gmsh_integrity.py
