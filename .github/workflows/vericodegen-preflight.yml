name: NeuroCAD VeriCodeGen methodology preflight

on:
  pull_request:
    paths:
      - '.github/workflows/vericodegen-preflight.yml'
      - 'research/vericodegen/**'
      - 'tests/test_vericodegen_*.py'
      - 'core/design_graph.py'
      - 'core/scad_export.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  methodology-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e .

      - name: Compile research modules
        run: python -m compileall -q research/vericodegen

      - name: Run all VeriCodeGen regression tests
        run: python -m pytest -q tests/test_vericodegen_*.py

      - name: Assert Stage 2 template stays non-authorized
        run: |
          python -m research.vericodegen.stage2_manifest \
            research/vericodegen/stage2_run_manifest.example.json \
            --template-check

      - name: Build frozen methodology preflight receipt
        run: |
          python -m research.vericodegen.preflight \
            --root . \
            --prompt-output-dir out/vericodegen_preflight/prompts \
            --output out/vericodegen_preflight/preflight_receipt.json

      - name: Verify receipt claim boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('out/vericodegen_preflight/preflight_receipt.json')
          receipt = json.loads(path.read_text(encoding='utf-8'))
          assert receipt['scientific_evidence'] is False
          assert receipt['outcomes_observed'] is False
          assert receipt['stage2_authorized'] is False
          assert receipt['ready_for_external_execution'] is False
          assert receipt['stage2_manifest_version'] == 'vericodegen-stage2-v2'
          required = {
              'benchmark_schema',
              'structured_schema',
              'verifier',
              'analysis_plan',
              'prompt_bundle',
              'stage2_manifest_template',
          }
          assert set(receipt['artifact_sha256']) == required
          assert all(len(value) == 64 for value in receipt['artifact_sha256'].values())
          assert len(receipt['prompt_receipt']['direct_sha256']) == 64
          assert len(receipt['prompt_receipt']['structured_sha256']) == 64
          print('VeriCodeGen methodology remains frozen, pre-outcome, and non-authorized.')
          PY

      - name: Retain methodology receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neurocad-vericodegen-preflight-${{ github.sha }}
          retention-days: 30
          path: out/vericodegen_preflight/**
