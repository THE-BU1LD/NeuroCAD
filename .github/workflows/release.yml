name: NeuroCAD Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Build and smoke-test distribution
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip build pytest
          python -m pip install -e .
          if [ -d tests ]; then python -m pytest -q; fi
          neurocad doctor
          python -m build
          python -m venv /tmp/neurocad-release
          /tmp/neurocad-release/bin/python -m pip install --upgrade pip
          /tmp/neurocad-release/bin/python -m pip install dist/*.whl
          /tmp/neurocad-release/bin/neurocad doctor
          /tmp/neurocad-release/bin/neurocad create "a plate with four holes" -o /tmp/release-smoke.scad
          test -s /tmp/release-smoke.scad

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "NeuroCAD $GITHUB_REF_NAME"
